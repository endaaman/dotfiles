# mise global config (dotfiles 管理 → ~/.config/mise/config.toml)

[settings]
# プロジェクトの .node-version を読ませる。
# mise の既定では idiomatic version file は全ツール無効 (enable_tools = []) で、
# これを入れないと .node-version があっても
#   "Plugin node does not have a version set"
# となり自動で切り替わらない。
#
# python を入れていないのは意図的:
#   .python-version は uv が生成・管理しており (nucllei / VLM / tt など)、
#   mise にも持たせると二重管理になる。python は uv に任せる。
idiomatic_version_file_enable_tools = ["node"]

[tools]
# グローバルの既定は LTS のメジャーを直書きする。
# ディストリの node (Ubuntu 24.04 の nodejs は 18) は古すぎて素で使えないので、
# 何も指定が無いディレクトリで使うものをここで決めておく。
#
# "latest" にしない理由: latest は Current (非LTS) を掴む。
#   node の major は年ではなく半年ごとに増える。偶数 major が春に出て
#   その年の10月に LTS 入り、奇数 major (25, 27...) は LTS にならない。
#   2026年春が 26 なのはたまたま年と一致しているだけで、2027年春は 28。
#
# 24 = Krypton (Active LTS, 2025-10-28〜、maintenance 2026-10-20、EOL 2028-04-30)
# 26 は 2026-10-28 に LTS 入りするので、その頃に上げる。
# ("lts" と書けば mise が自動追従するが、いつ何に切り替わったか分からなくなるので
#  dotfiles では明示的に固定する)
#
# プロジェクト配下では .node-version が上書きするので、これは
# 「指定が無いときの落とし所」でしかない。
node = "24"

# pnpm も major 固定（"latest" にしない）。pnpm には LTS が無いので最新 major を明示して追う。
# major で挙動が変わる（10 でビルドスクリプトの既定拒否、12 でそれがエラーに、等）ので、
# 上げるときは各 repo の package.json の "packageManager": "pnpm@12.x"（CI の pnpm/action-setup も
# これを読む）と pnpm-workspace.yaml の allowBuilds をいっしょに見る。ここは指定が無いディレクトリでの落とし所。
pnpm = "12"
