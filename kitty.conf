# Shell configuration
shell tmux new -As0
# 既定の xterm-kitty は ssh 先に terminfo が無いことが多く、リモートの tmux が起動できない。
# tmux.conf の terminal-features / Ms も xterm-256color 前提で書いてある
term xterm-256color

# Font configuration
font_family      monospace
font_size        14.0
adjust_line_height 0
adjust_column_width 0

# Window settings
remember_window_size  no
initial_window_width  140c
initial_window_height 40c
window_padding_width 0
hide_window_decorations no
window_border_width 0
window_margin_width 0
single_window_margin_width 0
background_opacity 1.0
dynamic_background_opacity yes
confirm_os_window_close 0

# Cursor
cursor_blink_interval 0

# Terminal bell
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# CJK settings
narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

# Mouse settings
# 負の値でキー入力したら即隠す（tym の autohide 相当）
mouse_hide_wait -1
url_style single
# tym と同じく、選択は PRIMARY だけに入れて CLIPBOARD は上書きしない
copy_on_select no

# Iceberg color scheme
foreground #c6c8d1
background #161821
cursor #c6c8d1

# Black
color0 #161821
color8 #6b7089

# Red
color1 #e27878
color9 #e98989

# Green
color2 #b4be82
color10 #c0ca8e

# Yellow
color3 #e2a478
color11 #e9b189

# Blue
color4 #84a0c6
color12 #91acd1

# Magenta
color5 #a093c7
color13 #ada0d3

# Cyan
color6 #89b8c2
color14 #95c4ce

# White
color7 #c6c8d1
color15 #d2d4de

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style angled
active_tab_foreground   #161821
active_tab_background   #84a0c6
active_tab_font_style   bold
inactive_tab_foreground #d2d4de
inactive_tab_background #6b7089
inactive_tab_font_style normal

# Keyboard shortcuts to match the tym config

# Reload config
map ctrl+shift+r load_config_file

# Command palette
# Ctrl+Shift+P は自作コマンド（action_alias my_*）だけを出すパレット（kitty_palette.py）。
# 各 my_* の直前の 1 行コメントが説明としてパレットに出る。kitty 組み込みのパレットは Ctrl+Shift+B
map ctrl+shift+p kitten ~/dotfiles/kitty_palette.py
map ctrl+shift+b command_palette

# クリップボードの画像をファイルにしてパスを貼る（ssh 中は ssh 先の /tmp/kitty-paste/ へ送る）
action_alias my_paste_image launch --type=background --allow-remote-control ~/dotfiles/bin/kitty-paste-image @active-kitty-window-id

# 接続先（~/Documents/dev/ssh-hosts）を選んで新しいウィンドウで ssh する
action_alias my_ssh_shell launch --type=overlay --allow-remote-control ~/dotfiles/bin/kitty-ssh-open shell
# 接続先を選んで新しいウィンドウで ssh し、ssh 先の tmux に入る
action_alias my_ssh_tmux launch --type=overlay --allow-remote-control ~/dotfiles/bin/kitty-ssh-open tmux

# hints は画面に出ているものにラベルを付けてキーで選ぶ。tmux の中でも表示中の画面から拾える

# 画面の URL を手元のブラウザで開く
action_alias my_hint_open_url kitten hints --type url
# 画面の URL をコピー
action_alias my_hint_copy_url kitten hints --type url --program @
# 画面のパスを入力欄に挿入
action_alias my_hint_insert_path kitten hints --type path --program -
# 画面の git のハッシュを入力欄に挿入
action_alias my_hint_insert_hash kitten hints --type hash --program -
# 画面の単語を入力欄に挿入
action_alias my_hint_insert_word kitten hints --type word --program -
# 画面の行をコピー
action_alias my_hint_copy_line kitten hints --type line --program @

# Reset config（実行中に変えた文字サイズ・透明度も戻す）
map ctrl+shift+u combine : load_config_file : change_font_size all 0 : set_background_opacity 1.0

# Control opacity
# tym の config.lua では同じキーに scale と alpha を二重定義していて、後に書いた alpha が勝っていた
map ctrl+shift+up set_background_opacity +0.05
map ctrl+shift+down set_background_opacity -0.05

# Reset scale and alpha
map ctrl+equal combine : set_background_opacity 1.0 : change_font_size all 0

# tmux で新しい window を開き（M-t）、zsh の Ctrl+G を叩いて Enter する
map ctrl+shift+g combine : send_key alt+t : sleep 0.1 : send_key ctrl+g : sleep 0.1 : send_key ctrl+m

# Scale controls
map ctrl+shift+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

# Ctrl+Tab は中のアプリへ Ctrl+N / Ctrl+P として送る（kitty のタブは使わない）
map ctrl+tab send_key ctrl+n
map ctrl+shift+tab send_key ctrl+p

# Alt key mappings
# tmux.conf の "remapped by tym" と対応（M-h/M-l を M-Left/M-Right として送る）
map alt+h send_key alt+left
map alt+l send_key alt+right
map alt+shift+h send_key alt+shift+left
map alt+shift+l send_key alt+shift+right

# マシンごとの上書き（無ければ何もしない）
globinclude local.conf
